services:
- type: web
  name: StockMate47
  env: python
  repo: https://github.com/juanphiri7/StockMate
  plan: free
  region: oregon
  buildCommand: pip install -r requirements.txt
  startCommand:  gunicorn app:app
  autoDeployTrigger: commit
  envVars:
        - key: DATABASE_URL
          fromDatabase:
            name: StockMate_db
            property: connectionString
        - key: FLASK_SECRET_KEY
          value: 74a7101016516e67a54d095ee2095d8e
        - key: ADMIN_PASSWORD
          value: StockMateAdmin@47 
- type: pgsql
  name: StockMate_db
  plan: free
  databaseName: stockmate_db
  user: stockmate_db_user  
version: "1"
